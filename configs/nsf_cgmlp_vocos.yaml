# Standalone configuration: FS2 -> frame expansion -> NSF cgMLP Vocos.
backbone: nsf_cgmlp_vocos
work_dir: ckpt/nsf_cgmlp_vocos
base_work_dir: ckpt/
init_checkpoint: null

dict_path: ['dictionary.txt']
data_index_path: datax/
interp_uv: true

audio_sample_rate: 44100
audio_num_mel_bins: 128
hop_size: 512
fft_size: 2048
win_size: 2048
fmin: 40
fmax: 16000
mel_vmin: -6.0
mel_vmax: 1.5

fs2_hidden_size: 256
fs2_lays: 4
fs2_heads: 4
fs2_dim_head: 64
fs2_kernel_size: 9

# No pitch embedding or legacy postnet. F0 only drives Combtooth excitation.
nsf_vocos_args:
  dim: 384
  num_front: 4
  num_back: 4
  kernel_size: 31
  expansion: 4.0
  dropout: 0.0

# Waveform L1 + multi-scale STFT loss; no discriminator yet.
lambda_l1: 1.0
lambda_mstft: 1.0
nsf_loss_fft_sizes: [2048, 1024, 512, 256]

optimizer_args:
  optimizer_cls: torch.optim.AdamW
  lr: 0.0006
  beta1: 0.9
  beta2: 0.98
  weight_decay: 0
lr_scheduler_args:
  scheduler_cls: lr_scheduler.scheduler.WarmupLR
  warmup_steps: 5000
  min_lr: 0.00001

batch_size: 6
DL_workers: 10
DL_workers_val: 2
dataloader_prefetch_factor: 4
accumulate_grad_batches: 1
pl_trainer_accelerator: gpu
pl_trainer_devices: auto
pl_trainer_num_nodes: 1
pl_trainer_precision: bf16
clip_grad_norm: 1
max_updates: 256000
val_check_interval: 8000
num_sanity_val_steps: 15
num_valid_plots: 15
log_interval: 50
num_ckpt_keep: 4
permanent_ckpt_start: 200000
permanent_ckpt_interval: 80000
seed: 4444
